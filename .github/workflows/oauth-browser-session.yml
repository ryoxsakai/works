name: Test OAuth browser login
on:
  pull_request:
    branches: [main]
    paths: ['worker/**', 'kdp/**', 'tutor/**', 'home.js', 'home.css', 'index.html', 'shared/**', '.github/workflows/oauth-browser-session.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-browser-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:kdp:browser
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: works-oauth-browser-screenshots
          path: worker/test-artifacts
          if-no-files-found: ignore
