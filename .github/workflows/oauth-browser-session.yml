name: Test OAuth browser login
on:
  pull_request:
    branches: [main]
    paths: ['worker/**', 'workflow/**', 'memo/**', 'todo/**', 'wiki/**', 'kdp/**', 'ss/**', 'tutor/**', 'home.js', 'home.css', 'index.html', 'shared/**', '.github/workflows/oauth-browser-session.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-browser-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test ../tutor/test/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:kdp:browser
      - run: npm run test:ss:browser
      - run: npm run test:wiki:browser
      - run: npm run test:workflow:browser
      - run: npm run test:next-lesson:browser
      - run: node test/record-layout.browser.mjs
      - run: npm run test:lesson-attribution:browser
      - run: npm run test:lesson-baseline:browser
      - run: npm run test:header:browser
      - run: node test/avatar.browser.mjs
      - run: node test/memo-ui.browser.mjs
      - run: node test/admission-ui.browser.mjs
      - run: node test/material-ui.browser.mjs
      - run: node test/tutor-ui.browser.mjs
      - run: node test/button-contrast.browser.mjs
      - run: CONTRAST_BASELINE=1 node test/tutor-button-states.browser.mjs
      - run: node test/tutor-button-states.browser.mjs
      - name: Verify category dialogs with compiled ToDo utilities
        run: |
          npx --yes --package tailwindcss@3.4.17 tailwindcss --content '../todo/index.html' --output /tmp/works-todo-ui.css --minify
          TODO_FIXTURE_CSS=/tmp/works-todo-ui.css npm run test:category:browser
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: works-oauth-browser-screenshots
          path: worker/test-artifacts
          if-no-files-found: ignore
