name: Test unified app shell
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'prototype/**', 'shared/**', 'tutor/app.js', 'worker/src/material-library-guarded.js', 'worker/test/material-library-guarded.test.mjs', 'worker/test/material-upload-races.test.mjs', 'worker/test/material-library-fixture.mjs', 'worker/src/index.js', 'worker/src/lesson-profile-mapping.js', 'worker/src/calendar-event-copies.js', 'worker/src/lesson-plan.js', 'worker/test/lesson-profile-load.test.mjs', 'worker/test/calendar-event-copies.test.mjs', 'worker/src/teaching-linked.js', 'worker/src/student-planning.js', 'worker/test/lesson-profile-mapping.test.mjs', 'worker/test/lesson-profile-mapping-fixture.mjs', 'worker/test/lesson-profile-migration.test.mjs', 'worker/migrations/20261029_lesson_profile_mapping.sql', '.github/workflows/app-shell.yml']
permissions:
  contents: read
jobs:
  app-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            prototype/package-lock.json
            worker/package-lock.json
      - run: npm ci --prefix prototype --ignore-scripts
      - run: npm ci --prefix worker --ignore-scripts
      - run: node --test worker/test/material-library-guarded.test.mjs worker/test/material-upload-races.test.mjs worker/test/material-code.test.mjs worker/test/lesson-profile-mapping.test.mjs worker/test/lesson-profile-migration.test.mjs worker/test/lesson-profile-load.test.mjs worker/test/calendar-event-copies.test.mjs
      - run: npm --prefix prototype test
      - name: Verify reproducible static app assets
        run: |
          npm --prefix prototype run build:app
          git diff --exit-code -- app/
          test -z "$(git ls-files --others --exclude-standard app/)"
      - run: node worker/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm --prefix prototype run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: works-unified-shell-synthetic-screenshots
          path: prototype/test-artifacts
          if-no-files-found: ignore
