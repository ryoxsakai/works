name: Test Works service design

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/works-design.yml'
      - 'shared/works-dialogs.css'
      - 'worker/test/works-dialogs.browser.mjs'
      - 'worker/test/next-lesson-binding.browser.mjs'
      - 'worker/test/tutor-period-profiles*'
      - 'worker/src/tutor-period-profiles.js'
      - 'shared/tutor-period-display.mjs'
      - 'index.html'
      - 'home-v2.css'
      - 'tutor/**'
      - 'material/**'
      - 'admission/**'
      - 'todo/**'
      - 'memo/**'

permissions:
  contents: read

jobs:
  service-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prepare-synthetic-test-fixture.mjs
      - run: npm ci --prefix worker --ignore-scripts
      - name: Install Chromium
        id: chromium
        run: node worker/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify next lesson binding and draft recovery on mobile
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node worker/test/next-lesson-binding.browser.mjs
      - name: Check school period settings and compatibility
        run: node --test tutor/test/period-display.test.mjs worker/test/tutor-period-profiles.test.mjs
      - name: Check school period settings in Chromium
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node worker/test/tutor-period-profiles.browser.mjs
      - name: Check dialog foundation across six services
        run: node worker/test/works-dialogs.browser.mjs
      - name: Check ToDo and Memo long dialog layout
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node scripts/test/todo-memo-dialog-layout.mjs
      - name: Check last service restore and overdue rescheduling
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node worker/test/restore-agenda.browser.mjs
      - name: Check Admissions filters and layout
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node worker/test/admission-ui.browser.mjs
      - name: Check Teaching and Materials dialog workflows
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/tutor-material-dialogs.cjs
