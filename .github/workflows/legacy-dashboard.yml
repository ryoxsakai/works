name: Test legacy menu dashboard
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'home.js', 'home.css', 'dashboard/**', 'shared/ui/**', 'shared/auth.js', 'shared/theme*', '.github/workflows/legacy-dashboard.yml']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker --ignore-scripts
      - run: npm ci --prefix shared/ui --ignore-scripts
      - run: npm run build --prefix shared/ui
      - run: git diff --exit-code -- shared/ui/menu-bootstrap.css shared/ui/icons.mjs shared/ui/ss-bootstrap.css shared/ui/ss-icons.mjs shared/ui/todo-bootstrap.css shared/ui/kdp-bootstrap.css shared/ui/kdp-icons.mjs shared/ui/wiki-bootstrap.css shared/ui/wiki-icons.mjs shared/ui/memo-bootstrap.css shared/ui/memo-icons.mjs shared/ui/admission-bootstrap.css shared/ui/admission-icons.mjs shared/ui/material-bootstrap.css shared/ui/material-icons.mjs shared/ui/workflow-bootstrap.css shared/ui/workflow-icons.mjs shared/ui/tutor-bootstrap.css shared/ui/tutor-icons.mjs shared/ui/carousel-bootstrap.css shared/ui/vendor/bootstrap-6.0.0-alpha.1
      - run: node --test dashboard/test/*.test.mjs
      - run: node worker/node_modules/playwright/cli.js install --with-deps chromium
      - run: node dashboard/test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: works-legacy-dashboard-synthetic-visual-qa
          path: test-artifacts/dashboard
          if-no-files-found: error
