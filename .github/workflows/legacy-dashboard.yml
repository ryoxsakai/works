name: Test legacy menu dashboard
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'home.js', 'home.css', 'dashboard/**', 'shared/auth.js', 'shared/theme*', '.github/workflows/legacy-dashboard.yml']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker --ignore-scripts
      - run: node --test dashboard/test/*.test.mjs
      - run: node worker/node_modules/playwright/cli.js install --with-deps chromium
      - run: node dashboard/test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: works-legacy-dashboard-synthetic-visual-qa
          path: test-artifacts/dashboard
          if-no-files-found: error
