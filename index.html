<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="apple-touch-icon" href="/shared/logo.png" />
  <link rel="stylesheet" href="/shared/styles.css?v=53" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
</head>
<body>
  <header class="page-header">
    <h1><span class="page-header-icon"><i class="bx bx-layer"></i></span> Works</h1>
    <div class="user-bar">
      <button id="open-home-settings" type="button" aria-label="設定" title="設定">
        <i class="bx bx-cog"></i>
      </button>
      <button id="home-auth-action" type="button" class="user-icon-btn" aria-label="Googleでログイン" title="Googleでログイン">
        <img id="user-avatar" alt="" hidden />
        <i class="bx bx-user-circle" id="user-avatar-fallback"></i>
      </button>
    </div>
  </header>

  <main>
    <p id="home-auth-error" class="error home-auth-error" role="alert"></p>
    <ul class="module-grid">
      <li>
        <a class="module-card" href="/tutor/">
          <h2><i class="bx bx-book-reader"></i> 授業管理</h2>
          <p>生徒ごとの授業予定と進捗を管理します</p>
        </a>
      </li>
      <li>
        <a class="module-card" href="/material/">
          <h2><i class="bx bx-library"></i> 教材管理</h2>
          <p>教材を保管し、分類・整理します</p>
        </a>
      </li>
      <li>
        <a class="module-card" href="/admission/">
          <h2><i class="bx bx-calendar-event"></i> 入試管理</h2>
          <p>大学入試の日程と予定を管理します</p>
        </a>
      </li>
    </ul>
  </main>

  <dialog id="home-settings-modal" class="app-modal home-settings-modal">
    <div class="modal-header">
      <h2><i class="bx bx-cog"></i> 設定</h2>
      <button type="button" id="home-settings-close" class="modal-close" aria-label="閉じる"><i class="bx bx-x"></i></button>
    </div>
    <div class="modal-tab-panel">
      <div class="theme-options">
        <label><input type="radio" name="home-theme" value="light" /> ライト</label>
        <label><input type="radio" name="home-theme" value="dark" /> ダーク</label>
      </div>
    </div>
  </dialog>

  <script type="module" src="/home.js?v=1"></script>
</body>
</html>
