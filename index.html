<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works</title>
  <link rel="apple-touch-icon" href="/shared/logo.png">
  <style>
    body { margin:0; background:#f4f5f7; color:#191b22; font:16px system-ui,sans-serif; }
    main { width:min(320px,85vw); margin:23vh auto; text-align:center; }
    button { padding:12px 24px; border:0; border-radius:12px; background:#465bdd; color:white; font:inherit; }
  </style>
</head>
<body>
  <main hidden><h1>Works</h1><button type="button">Googleでログイン</button></main>
  <script type="module">
    import { lastService } from '/shared/resume-service.mjs';
    import { signIn } from '/shared/auth.js?v=14';
    let session;
    try { session = localStorage.getItem('works_session_token'); } catch {}
    if (document.querySelector('meta[name="works-entry-auth"][content="cookie"]') || session) location.replace(lastService());
    else {
      document.querySelector('main').hidden = false;
      document.querySelector('button').onclick = () => {
        try { localStorage.setItem('works_pending_destination', lastService()); } catch {}
        signIn('/tutor/');
      };
    }
  </script>
</body>
</html>
