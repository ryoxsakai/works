<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>入試管理 | Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="apple-touch-icon" href="/shared/logo.png" />
  <link rel="stylesheet" href="/shared/styles.css?v=52" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link rel="stylesheet" href="/admission/admission.css?v=6" />
</head>
<body>
  <header class="page-header">
    <h1><a href="/">入試管理</a></h1>
  </header>

  <main class="admission-main">
    <a class="admission-back" href="/"><i class="bx bx-chevron-left"></i> Worksトップへ</a>

    <section id="signed-out" class="admission-auth">
      <p>入試日程の登録・編集にはログインが必要です。</p>
      <button id="sign-in" type="button" class="btn-primary">Googleでログイン</button>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="signed-in" hidden>
      <p id="admission-error" class="error" role="alert"></p>
      <section class="admission-panel" aria-labelledby="admission-title">
      <div class="admission-heading">
        <div class="admission-heading-copy">
          <p class="eyebrow">ADMISSION CALENDAR</p>
          <h2 id="admission-title"><i class="bx bx-calendar-event"></i> 入試日程</h2>
        </div>
        <button id="admission-add" type="button" class="btn-primary admission-add"><i class="bx bx-plus"></i> 日程を追加</button>
      </div>

      <div class="admission-filter-bar" aria-label="入試日程の絞り込み">
        <button id="admission-filter-open" type="button" class="btn-primary admission-filter-open">
          <i class="bx bx-filter-alt"></i>
          絞り込み
          <span id="admission-filter-count" class="admission-filter-count" hidden>0</span>
        </button>
        <p id="admission-filter-summary" class="admission-filter-summary">すべての入試日程</p>
        <button id="admission-filter-reset" type="button" class="admission-filter-reset" aria-label="絞り込みを解除" hidden>
          <i class="bx bx-reset"></i>
        </button>
      </div>

      <div class="admission-view-tabs" role="tablist" aria-label="入試日程の表示形式">
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-list" data-admission-view-tab="list">
          <i class="bx bx-list-ul"></i> 一覧
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-calendar" data-admission-view-tab="calendar">
          <i class="bx bx-calendar"></i> カレンダー
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-gantt" data-admission-view-tab="gantt">
          <i class="bx bx-bar-chart-alt-2"></i> ガント
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-table" data-admission-view-tab="table">
          <i class="bx bx-table"></i> 表
        </button>
      </div>

      <section id="admission-view-list" class="admission-view" role="tabpanel" data-admission-view="list">
        <div id="admission-list"></div>
      </section>

      <section id="admission-view-calendar" class="admission-view" role="tabpanel" data-admission-view="calendar" hidden>
        <div class="admission-calendar-nav">
          <button id="admission-calendar-prev" type="button" aria-label="前の月"><i class="bx bx-chevron-left"></i></button>
          <strong id="admission-calendar-label"></strong>
          <button id="admission-calendar-next" type="button" aria-label="次の月"><i class="bx bx-chevron-right"></i></button>
        </div>
        <div class="admission-calendar-shell">
          <div id="admission-calendar-grid" class="admission-calendar-grid"></div>
        </div>
        <p id="admission-calendar-empty" class="admission-view-note" hidden>この月の入試日程はありません。</p>
      </section>

      <section id="admission-view-gantt" class="admission-view" role="tabpanel" data-admission-view="gantt" hidden>
        <div class="admission-gantt-shell">
          <div id="admission-gantt" class="admission-gantt-inner"></div>
        </div>
        <p id="admission-gantt-empty" class="admission-view-note" hidden>表示できる入試日程はありません。</p>
      </section>

      <section id="admission-view-table" class="admission-view" role="tabpanel" data-admission-view="table" hidden>
        <div class="admission-table-shell">
          <table class="admission-table">
            <thead><tr><th>大学</th><th>方式</th><th>区分</th><th>日付</th><th>補足</th></tr></thead>
            <tbody id="admission-table-body"></tbody>
          </table>
        </div>
      </section>
      </section>
    </section>
  </main>

  <dialog id="admission-filter-modal" class="app-modal admission-filter-modal">
    <div class="modal-header">
      <h2><i class="bx bx-filter-alt"></i> 絞り込み設定</h2>
      <button id="admission-filter-close" type="button" class="modal-close" aria-label="閉じる"><i class="bx bx-x"></i></button>
    </div>

    <div class="modal-tabs admission-filter-tabs" role="tablist" aria-label="絞り込み項目">
      <button type="button" role="tab" data-admission-filter-tab="universities" aria-controls="admission-filter-panel-universities">
        <i class="bx bx-building-house"></i> 大学
      </button>
      <button type="button" role="tab" data-admission-filter-tab="types" aria-controls="admission-filter-panel-types">
        <i class="bx bx-category"></i> 方式
      </button>
      <button type="button" role="tab" data-admission-filter-tab="months" aria-controls="admission-filter-panel-months">
        <i class="bx bx-calendar"></i> 一次実施月
      </button>
    </div>

    <form id="admission-filter-form" class="admission-filter-form">
      <section id="admission-filter-panel-universities" class="admission-filter-panel" role="tabpanel" data-admission-filter-panel="universities">
        <label class="admission-filter-modal-search">
          <i class="bx bx-search"></i>
          <input id="admission-filter-university-search" type="search" placeholder="大学名を検索" autocomplete="off" />
        </label>
        <p class="admission-filter-help">対象にしたい大学を複数選択できます。</p>
        <div id="admission-filter-university-list" class="admission-filter-options admission-filter-university-list"></div>
      </section>

      <section id="admission-filter-panel-types" class="admission-filter-panel" role="tabpanel" data-admission-filter-panel="types" hidden>
        <p class="admission-filter-help">対象にしたい方式を複数選択できます。</p>
        <div class="admission-filter-options">
          <label class="admission-filter-option"><input type="checkbox" name="filter_type" value="general" /><span>一般選抜</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_type" value="ct" /><span>共通テスト利用</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_type" value="recommendation" /><span>推薦</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_type" value="regional" /><span>地域枠</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_type" value="comprehensive" /><span>総合型選抜</span></label>
        </div>
      </section>

      <section id="admission-filter-panel-months" class="admission-filter-panel" role="tabpanel" data-admission-filter-panel="months" hidden>
        <p class="admission-filter-help">一次試験が実施される月を複数選択できます。</p>
        <div class="admission-filter-options admission-filter-month-options">
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="10" /><span>10月</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="11" /><span>11月</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="12" /><span>12月</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="1" /><span>1月</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="2" /><span>2月</span></label>
          <label class="admission-filter-option"><input type="checkbox" name="filter_month" value="3" /><span>3月</span></label>
        </div>
      </section>

      <div class="admission-filter-actions">
        <button id="admission-filter-clear" type="button"><i class="bx bx-reset"></i> すべて解除</button>
        <button type="submit" class="btn-primary"><i class="bx bx-check"></i> 適用</button>
      </div>
    </form>
  </dialog>

  <dialog id="admission-editor" class="app-modal">
    <div class="modal-header">
      <h2><i class="bx bx-calendar-plus"></i> 入試日程を追加</h2>
      <button id="admission-editor-close" type="button" class="modal-close" aria-label="閉じる"><i class="bx bx-x"></i></button>
    </div>
    <form id="admission-form" class="modal-tab-panel admission-form">
      <label>大学名<input name="university" type="text" placeholder="例：帝京大学医学部" required /></label>
      <label>方式<select name="selection_type"><option value="general">一般選抜</option><option value="ct">共通テスト利用</option><option value="recommendation">推薦</option><option value="regional">地域枠</option><option value="comprehensive">総合型選抜</option></select></label>
      <label>段階<select name="stage"><option value="primary">一次試験</option><option value="first_result">一次発表</option><option value="secondary">二次試験</option><option value="final_result">合格発表</option></select></label>
      <label>日付<input name="schedule_date" type="date" required /></label>
      <label>補足<textarea name="notes" rows="3" placeholder="選択日・会場・補足など"></textarea></label>
      <label>出典URL<input name="source_url" type="url" placeholder="https://..." /></label>
      <div class="edit-actions admission-form-actions"><button type="submit" class="btn-primary"><i class="bx bx-check"></i> 保存</button></div>
    </form>
  </dialog>

  <script type="module" src="/admission/app.js?v=7"></script>
</body>
</html>
