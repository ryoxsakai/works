<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>入試管理 | Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="apple-touch-icon" href="/shared/logo.png" />
  <link rel="stylesheet" href="/shared/styles.css?v=52" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link rel="stylesheet" href="/admission/admission.css?v=3" />
</head>
<body>
  <header class="page-header">
    <h1><a href="/">入試管理</a></h1>
  </header>

  <main class="admission-main">
    <a class="admission-back" href="/"><i class="bx bx-chevron-left"></i> Worksトップへ</a>

    <section id="signed-out" class="admission-auth">
      <p>入試日程の登録・編集にはログインが必要です。</p>
      <button id="sign-in" type="button" class="btn-primary">Googleでログイン</button>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="signed-in" hidden>
      <p id="admission-error" class="error" role="alert"></p>
      <section class="admission-panel" aria-labelledby="admission-title">
      <div class="admission-heading">
        <div class="admission-heading-copy">
          <p class="eyebrow">ADMISSION CALENDAR</p>
          <h2 id="admission-title"><i class="bx bx-calendar-event"></i> 入試日程</h2>
        </div>
        <button id="admission-add" type="button" class="btn-primary admission-add"><i class="bx bx-plus"></i> 日程を追加</button>
      </div>

      <div class="admission-view-tabs" role="tablist" aria-label="入試日程の表示形式">
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-list" data-admission-view-tab="list">
          <i class="bx bx-list-ul"></i> 一覧
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-calendar" data-admission-view-tab="calendar">
          <i class="bx bx-calendar"></i> カレンダー
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-gantt" data-admission-view-tab="gantt">
          <i class="bx bx-bar-chart-alt-2"></i> ガント
        </button>
        <button class="admission-view-tab" type="button" role="tab" aria-controls="admission-view-table" data-admission-view-tab="table">
          <i class="bx bx-table"></i> 表
        </button>
      </div>

      <section id="admission-view-list" class="admission-view" role="tabpanel" data-admission-view="list">
        <div id="admission-list"></div>
      </section>

      <section id="admission-view-calendar" class="admission-view" role="tabpanel" data-admission-view="calendar" hidden>
        <div class="admission-calendar-nav">
          <button id="admission-calendar-prev" type="button" aria-label="前の月"><i class="bx bx-chevron-left"></i></button>
          <strong id="admission-calendar-label"></strong>
          <button id="admission-calendar-next" type="button" aria-label="次の月"><i class="bx bx-chevron-right"></i></button>
        </div>
        <div class="admission-calendar-shell">
          <div id="admission-calendar-grid" class="admission-calendar-grid"></div>
        </div>
        <p id="admission-calendar-empty" class="admission-view-note" hidden>この月の入試日程はありません。</p>
      </section>

      <section id="admission-view-gantt" class="admission-view" role="tabpanel" data-admission-view="gantt" hidden>
        <div class="admission-gantt-shell">
          <div id="admission-gantt" class="admission-gantt-inner"></div>
        </div>
        <p id="admission-gantt-empty" class="admission-view-note" hidden>表示できる入試日程はありません。</p>
      </section>

      <section id="admission-view-table" class="admission-view" role="tabpanel" data-admission-view="table" hidden>
        <div class="admission-table-shell">
          <table class="admission-table">
            <thead><tr><th>大学</th><th>方式</th><th>区分</th><th>日付</th><th>補足</th></tr></thead>
            <tbody id="admission-table-body"></tbody>
          </table>
        </div>
      </section>
      </section>
    </section>
  </main>

  <dialog id="admission-editor" class="app-modal">
    <div class="modal-header">
      <h2><i class="bx bx-calendar-plus"></i> 入試日程を追加</h2>
      <button id="admission-editor-close" type="button" class="modal-close" aria-label="閉じる"><i class="bx bx-x"></i></button>
    </div>
    <form id="admission-form" class="modal-tab-panel admission-form">
      <label>大学名<input name="university" type="text" placeholder="例：帝京大学医学部" required /></label>
      <label>方式<select name="selection_type"><option value="general">一般選抜</option><option value="ct">共通テスト利用</option><option value="recommendation">推薦</option><option value="regional">地域枠</option><option value="comprehensive">総合型選抜</option></select></label>
      <label>段階<select name="stage"><option value="primary">一次試験</option><option value="first_result">一次発表</option><option value="secondary">二次試験</option><option value="final_result">合格発表</option></select></label>
      <label>日付<input name="schedule_date" type="date" required /></label>
      <label>補足<textarea name="notes" rows="3" placeholder="選択日・会場・補足など"></textarea></label>
      <label>出典URL<input name="source_url" type="url" placeholder="https://..." /></label>
      <div class="edit-actions admission-form-actions"><button type="submit" class="btn-primary"><i class="bx bx-check"></i> 保存</button></div>
    </form>
  </dialog>

  <script type="module" src="/admission/app.js?v=3"></script>
</body>
</html>
