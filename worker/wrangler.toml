# Version commandを無効化(実質no-op)した後の再デプロイトリガー用
name = "works"
main = "src/index.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "works.lrnr.jp/api/*", zone_name = "lrnr.jp" },
]

[vars]
GOOGLE_CLIENT_ID = "196806466819-2bcole85u4k53h1iqk6jr69ppans7egf.apps.googleusercontent.com"
ALLOWED_EMAIL = "ryoxsakai@gmail.com"
ALLOWED_ORIGIN = "https://works.lrnr.jp"

# 以下はここに書かず、Cloudflareダッシュボード(Workers & Pages → works →
# 設定 → 変数とシークレット)でSecretとして追加すること:
#   GOOGLE_CLIENT_SECRET … Google Cloud Consoleの同じOAuthクライアントのクライアントシークレット
#   SESSION_SECRET        … このWorkerが発行するセッショントークン署名用のランダムな文字列

[[d1_databases]]
binding = "DB"
database_name = "tutor-db"
database_id = "941460fb-c46e-4158-b4a7-5bb468b542ca"
