<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SS管理 | Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="apple-touch-icon" href="/shared/logo.png" />
  <link rel="stylesheet" href="/shared/styles.css?v=55" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link rel="stylesheet" href="/ss/ss.css?v=2" />
</head>
<body>
  <header class="page-header">
    <h1><a href="/">SS管理</a></h1>
    <div class="user-bar" hidden>
      <button id="sign-out" type="button" class="user-icon-btn" aria-label="ログアウト">
        <img id="user-avatar" alt="" hidden />
        <i class="bx bx-user-circle" id="user-avatar-fallback"></i>
      </button>
    </div>
  </header>

  <main class="ss-main">
    <section id="signed-in" hidden>
      <p id="ss-error" class="error" role="alert"></p>
      <section class="ss-panel" aria-labelledby="ss-title">
        <div class="ss-heading">
          <div>
            <p class="eyebrow">PROJECT TRACKER</p>
            <h2 id="ss-title"><i class="bx bx-briefcase-alt-2"></i> SS案件</h2>
          </div>
          <p id="ss-summary" class="ss-summary" aria-live="polite"></p>
        </div>

        <div class="ss-sort-toolbar" aria-label="案件の並べ替え">
          <label for="ss-sort-key">並べ替え</label>
          <select id="ss-sort-key">
            <option value="name">案件</option>
            <option value="status">進捗</option>
            <option value="deadline" selected>締切日</option>
            <option value="remaining">残り期間</option>
          </select>
          <button id="ss-sort-direction" type="button" aria-label="降順に切り替える">
            <i class="bx bx-sort-up" aria-hidden="true"></i>
            <span>昇順</span>
          </button>
        </div>

        <div class="ss-table-shell">
          <table class="ss-table">
            <thead>
              <tr>
                <th aria-sort="none"><button class="ss-sort-button" type="button" data-sort-key="name">案件<i class="bx bx-sort-alt-2" aria-hidden="true"></i></button></th>
                <th aria-sort="none"><button class="ss-sort-button" type="button" data-sort-key="status">進捗<i class="bx bx-sort-alt-2" aria-hidden="true"></i></button></th>
                <th aria-sort="ascending"><button class="ss-sort-button" type="button" data-sort-key="deadline">締切日<i class="bx bx-sort-up" aria-hidden="true"></i></button></th>
                <th aria-sort="none"><button class="ss-sort-button" type="button" data-sort-key="remaining">残り期間<i class="bx bx-sort-alt-2" aria-hidden="true"></i></button></th>
                <th>メモ</th>
              </tr>
            </thead>
            <tbody id="ss-project-list"></tbody>
          </table>
          <div id="ss-empty" class="ss-empty" hidden>
            <i class="bx bx-inbox"></i>
            <p>登録中のプロジェクトはありません。</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/ss/app.js?v=2"></script>
</body>
</html>
