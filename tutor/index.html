<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個別授業管理 | Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="../shared/styles.css?v=9" />
</head>
<body>
  <header class="page-header">
    <h1><a href="/">Works</a> / 個別授業管理</h1>
  </header>

  <main>
    <section id="signed-out">
      <p>このページはログインが必要です。</p>
      <button id="sign-in">Googleでログイン</button>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="signed-in" hidden>
      <div class="user-bar">
        <span id="user-email"></span>
        <div>
          <button id="open-settings" type="button">設定</button>
          <button id="sign-out">ログアウト</button>
        </div>
      </div>
      <p id="action-error" class="error"></p>

      <div class="panel">
        <div class="panel-header">
          <h2>授業予定</h2>
          <div class="view-toggle" role="group" aria-label="表示切り替え">
            <button type="button" class="view-toggle-btn" data-view="list">リスト</button>
            <button type="button" class="view-toggle-btn" data-view="calendar">カレンダー</button>
          </div>
        </div>
        <p id="name-filter-bar" hidden>
          フィルタ: <strong id="name-filter-label"></strong>
          <button type="button" id="clear-name-filter">解除</button>
        </p>
        <ul id="event-list"></ul>
        <div id="calendar-view" hidden>
          <div class="calendar-nav">
            <button type="button" id="cal-prev">‹ 前月</button>
            <span id="cal-month-label"></span>
            <button type="button" id="cal-next">翌月 ›</button>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </div>

    </section>
  </main>

  <dialog id="settings-modal">
    <div class="modal-header">
      <h2>設定</h2>
      <button type="button" id="settings-close" class="modal-close" aria-label="閉じる">×</button>
    </div>
    <div class="modal-tabs" role="tablist">
      <button type="button" class="tab-btn" data-tab="calendar" role="tab" aria-selected="true">カレンダー</button>
      <button type="button" class="tab-btn" data-tab="terms" role="tab" aria-selected="false">学期</button>
      <button type="button" class="tab-btn" data-tab="appearance" role="tab" aria-selected="false">デザイン</button>
    </div>
    <div class="modal-tab-panel" data-tab-panel="calendar">
      <p class="hint">授業予定が入っているカレンダーにチェックを入れてください(全デバイス共通の設定です)。色はGoogleカレンダー側の設定がそのまま使われます。</p>
      <div id="calendar-checklist"></div>
    </div>
    <div class="modal-tab-panel" data-tab-panel="terms" hidden>
      <p class="hint">年度ごとに学期(期間)を登録します。学期にチェックを入れると、複数またいでも予定を絞り込めます(全デバイス共通)。</p>
      <div id="year-groups"></div>
      <form id="add-year-form" class="term-form">
        <input id="new-year-label" type="text" placeholder="例: 2026年度" required />
        <button type="submit">年度を追加</button>
      </form>
    </div>
    <div class="modal-tab-panel" data-tab-panel="appearance" hidden>
      <div class="theme-options">
        <label><input type="radio" name="theme" value="system" /> システムに合わせる</label>
        <label><input type="radio" name="theme" value="light" /> ライト</label>
        <label><input type="radio" name="theme" value="dark" /> ダーク</label>
      </div>
    </div>
  </dialog>

  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
