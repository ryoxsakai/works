<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個別授業管理 | Works</title>
  <script>
    (function () {
      var t = localStorage.getItem("works_theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="../shared/styles.css?v=5" />
</head>
<body>
  <header class="page-header">
    <h1><a href="/">Works</a> / 個別授業管理</h1>
  </header>

  <main>
    <section id="signed-out">
      <p>このページはログインが必要です。</p>
      <button id="sign-in">Googleでログイン</button>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="signed-in" hidden>
      <div class="user-bar">
        <span id="user-email"></span>
        <div>
          <button id="open-settings" type="button">設定</button>
          <button id="sign-out">ログアウト</button>
        </div>
      </div>
      <p id="action-error" class="error"></p>

      <div class="panel">
        <h2>生徒</h2>
        <select id="student-select"></select>
        <form id="add-student-form" class="inline-form">
          <input id="new-student-name" type="text" placeholder="生徒名" required />
          <input id="new-student-tag" type="text" placeholder="カレンダー識別タグ(任意)" />
          <button type="submit">追加</button>
        </form>
      </div>

      <div class="panel">
        <h2>授業予定(カレンダー)</h2>
        <ul id="event-list"></ul>
      </div>

      <div class="panel">
        <h2>授業メモ</h2>
        <form id="note-form" hidden>
          <p id="note-event-label"></p>
          <textarea id="note-text" placeholder="メモ" rows="3"></textarea>
          <input id="note-score" type="text" placeholder="評価(任意)" />
          <button type="submit">保存</button>
        </form>
        <ul id="note-list"></ul>
      </div>
    </section>
  </main>

  <dialog id="settings-modal">
    <div class="modal-header">
      <h2>設定</h2>
      <button type="button" id="settings-close" class="modal-close" aria-label="閉じる">×</button>
    </div>
    <div class="modal-tabs" role="tablist">
      <button type="button" class="tab-btn" data-tab="calendar" role="tab" aria-selected="true">カレンダー</button>
      <button type="button" class="tab-btn" data-tab="appearance" role="tab" aria-selected="false">デザイン</button>
    </div>
    <div class="modal-tab-panel" data-tab-panel="calendar">
      <p class="hint">授業予定が入っているカレンダーにチェックを入れてください(全デバイス共通の設定です)。</p>
      <div id="calendar-checklist"></div>
    </div>
    <div class="modal-tab-panel" data-tab-panel="appearance" hidden>
      <div class="theme-options">
        <label><input type="radio" name="theme" value="system" /> システムに合わせる</label>
        <label><input type="radio" name="theme" value="light" /> ライト</label>
        <label><input type="radio" name="theme" value="dark" /> ダーク</label>
      </div>
    </div>
  </dialog>

  <script type="module" src="./app.js?v=5"></script>
</body>
</html>
