<h1>授業記録の転記</h1><p>2026年10月20日以降の各授業だけを対象にします。既存の説明がある予定は通常保留します。内容を確認した1件だけ、別の置換確認から処理できます。元のDB記録は残ります。所属未確認の記録は、予定ごとに本人確認済みの内容を確認してから帰属を確定します。</p>
<label>処理内容 <select id="mode"><option value="migration">旧DBから授業記録を転記</option><option value="remove_management_tags">転記済み記録の管理タグだけ除去</option></select></label>
